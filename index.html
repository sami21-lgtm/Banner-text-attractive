<!DOCTYPE html>
<html lang="en">
<head>

  <title>Banner Text Hover Effect Slider</title>
  <link rel="stylesheet" href="style.css">

<body>

  <div class="slider-container">
    <div class="banner-text">
      <h2>Banner Text <span class="hover-effect">Hover Effect</span></h2>

    <div class="slides">
        <div class="slide active">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_46_01 PM.png"></div>
            <h1 class="image-name animated">DESERT</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_47_03 PM.png"></div>
            <h1 class="image-name animated">FOREST</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="3e533be0-ecfd-4d90-af7d-c0a4fb7f8fc1.png"></div>
            <h1 class="image-name animated">CANYON</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_52_05 PM.png"></div>
            <h1 class="image-name animated">GLACIER</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_52_45 PM.png"></div>
            <h1 class="image-name animated">OCEAN</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_54_05 PM.png"></div>
            <h1 class="image-name animated">FALLS</h1>
        </div>
    </div>
  </div>

  <audio id="bg-music" src="jboy-remix_aya-nakamura-copines-jboyremix-iwg-_ (2).mp3" preload="auto" loop></audio>

  <script src="script.js"></script>
</body>
</html>
