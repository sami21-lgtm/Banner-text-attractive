<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banner Text Hover Effect Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="slider-container">
    <div class="banner-text">
      <h2>Banner Text <span class="hover-effect">Hover Effect</span></h2>
    </div>
    
    <div class="slides">
        <div class="slide active">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_46_01 PM.png"></div>
            <h1 class="image-name animated">DESERT</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_47_03 PM.png"></div>
            <h1 class="image-name animated">FOREST</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="3e533be0-ecfd-4d90-af7d-c0a4fb7f8fc1.png"></div>
            <h1 class="image-name animated">CANYON</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_52_05 PM.png"></div>
            <h1 class="image-name animated">GLACIER</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_52_45 PM.png"></div>
            <h1 class="image-name animated">OCEAN</h1>
        </div>
        <div class="slide">
            <div class="image-container" data-image="ChatGPT Image May 30, 2026, 07_54_05 PM.png"></div>
            <h1 class="image-name animated">FALLS</h1>
        </div>
    </div>
  </div>

  <!-- 🎵 গান দ্রুত রেডি করার জন্য autoplay এবং muted ব্যবহার করা হয়েছে -->
  <audio id="bg-music" src="bg-music.mp3" loop autoplay muted preload="auto"></audio>

  <script src="script.js"></script>

  <!-- ⚡ সুপার ফাস্ট অডিও অ্যাক্টিভেশন স্ক্রিপ্ট -->
  <script>
    const music = document.getElementById('bg-music');

    // পেজ লোড হতেই ব্যাকগ্রাউন্ডে গান প্লে করে রাখা (মিউটেড অবস্থায়)
    window.addEventListener('DOMContentLoaded', () => {
      music.play().catch(() => {
        console.log("Autoplay blocked, waiting for user touch...");
      });
    });

    // ইউজার স্ক্রিনে টাচ বা ক্লিক করা মাত্রই গান আনমিউট এবং প্লে হবে
    function instantPlay() {
      if (music) {
        music.muted = false; // মিউট তুলে দেওয়া হলো
        if (music.paused) {
          music.play().catch(err => console.log(err));
        }
        
        // একবার গান চালু হয়ে গেলে ইভেন্টগুলো রিমুভ করে দেওয়া হবে পারফরম্যান্সের জন্য
        allEvents.forEach(event => document.removeEventListener(event, instantPlay));
      }
    }

    // মোবাইলের জন্য touchstart এবং pointerdown সবচেয়ে ফাস্ট কাজ করে
    const allEvents = ['touchstart', 'pointerdown', 'click'];
    allEvents.forEach(event => document.addEventListener(event, instantPlay, { passive: true }));
  </script>
</body>
</html>
